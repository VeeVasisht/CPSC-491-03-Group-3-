
# Deploy pull requests to Firebase Hosting preview channels.
# Run smoke tests against the unique preview URL after deployment.

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    name: Build and Deploy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    outputs:
      preview_url: ${{ steps.deploy.outputs.details_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to Firebase Hosting Preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WETRAVEL_569A0 }}
          projectId: wetravel-569a0

  verify_preview:
    name: Verify PR Preview Deployment
    runs-on: ubuntu-latest
    needs: build_and_preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preview smoke tests
        env:
          SMOKE_BASE_URL: ${{ needs.build_and_preview.outputs.preview_url }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "Error: Firebase preview URL is missing."
            exit 1
          fi

          echo "Verifying Firebase Hosting preview deployment..."
          npm run test:smoke
