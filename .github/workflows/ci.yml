name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
        continue-on-error: true
      - name: Run unit tests
        run: npx vitest run

  build:
    name: Build (versioned)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set build version
        run: echo "BUILD_VERSION=build-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Show build version
        run: echo "Building $BUILD_VERSION"
      - name: Build
        run: npm run build
      - name: Build summary
        run: echo "Built \`$BUILD_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
