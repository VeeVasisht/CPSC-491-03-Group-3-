# Deploy to Firebase Hosting when changes are merged into main.
# Run production smoke tests after a successful deployment.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Generate Build Version
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_VERSION="v0.2.${BUILD_NUM}-${SHORT_SHA}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "::notice title=Production Build Version::Building version ${BUILD_VERSION}"

      - name: Build application
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION}}
          
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WETRAVEL_569A0 }}
          channelId: live
          projectId: wetravel-569a0
  verify_production:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production smoke tests
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: https://wetravel-569a0.web.app
