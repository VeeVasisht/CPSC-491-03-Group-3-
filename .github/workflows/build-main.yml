name: Main Branch Automated Build

on:
  push:
    branches: [main]

jobs:
  main-build:
    name: Build Main Branch Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Main Release Identifier
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_VERSION="v0.2.${BUILD_NUM}-${SHORT_SHA}"
          echo "::notice title=Main Build Release::Generated Artifact Version ${BUILD_VERSION}"

      - name: Execute Production Build
        run: npm run build